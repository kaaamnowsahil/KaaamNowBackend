[project]
name = "kaaamnow-api"
# Packaging / pip metadata only — API runtime version is APP_VERSION.
version = "1.0.0"
description = "KaaamNow shift-staffing API (FastAPI + asyncpg + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "PyJWT[crypto]>=2.9.0",
  "vercel-blob>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
kaaamnow-api = "app.kaaamnow_api_server:start_kaaamnow_api_server"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

# Coverage gate for money and coupon logic (make coverage). Every file listed here must stay at
# or above fail_under for statements + branches combined; the report also lists each column.
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
include = [
  "app/services/pricing/*.py",
  "app/services/live_work/live_pricing.py",
  "app/services/promos/promo_rules.py",
  "app/services/promos/promo_service.py",
  "app/repositories/promos/promo_repository.py",
  "app/services/cancellations/cancellation_rules.py",
  "app/services/shifts/domain/shift_rules.py",
  "app/services/live_work/live_work_billing.py",
  "app/utils/money.py",
]
fail_under = 95
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
