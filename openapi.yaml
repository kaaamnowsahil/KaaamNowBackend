components:
  schemas:
    AccountDeletionEvent:
      properties:
        event_type:
          type: string
          title: Event Type
        actor_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
        details:
          additionalProperties: true
          type: object
          title: Details
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - event_type
      - details
      - created_at
      title: AccountDeletionEvent
    AccountDeletionHoldCreate:
      properties:
        basis:
          type: string
          enum:
          - pending_booking
          - pending_payment
          - refund
          - dispute
          - complaint
          - legal_obligation
          - fraud_investigation
          title: Basis
        reason:
          type: string
          maxLength: 1000
          minLength: 20
          title: Reason
        reference:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Reference
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - basis
      - reason
      - expires_at
      title: AccountDeletionHoldCreate
    AccountDeletionRequestPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminAccountDeletionRequest'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
