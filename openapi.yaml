      summary: Verify Firebase phone token and set password · Public
      operationId: confirm_password_reset_api_v1_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/token/refresh:
    post:
      tags:
      - auth
      summary: Rotate refresh token · Public
      operationId: refresh_api_v1_auth_token_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Log out (revoke refresh token) · Any signed-in user
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/profile:
    get:
      tags:
      - me
      summary: Get my Business / Work, Worker or account profile · Any signed-in user
      operationId: get_profile_api_v1_me_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - me
      summary: Update my profile (role-specific fields) · Any signed-in user
      operationId: update_profile_api_v1_me_profile_patch
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/BusinessProfilePatch'
              - $ref: '#/components/schemas/WorkerProfilePatch'
              - $ref: '#/components/schemas/AccountProfilePatch'
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/profile/image:
    post:
      tags:
      - me
      summary: 'Upload my profile photo (Business / Work: primary logo) — JPEG, PNG
        or WebP · Any signed-in user'
      operationId: upload_profile_image_api_v1_me_profile_image_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_profile_image_api_v1_me_profile_image_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/businesses:
    get:
      tags:
      - me
      summary: List my Business / Work profiles · Business / Work
      operationId: list_businesses_api_v1_me_businesses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BusinessProfileResponse'
                type: array
                title: Response List Businesses Api V1 Me Businesses Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - me
      summary: Add a Business / Work profile · Business / Work
      operationId: create_business_api_v1_me_businesses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessEntityCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/businesses/{business_profile_id}:
    get:
      tags:
      - me
      summary: Get one of my Business / Work profiles · Business / Work
      operationId: get_business_api_v1_me_businesses__business_profile_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: business_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Business Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - me
      summary: Update one of my Business / Work profiles · Business / Work
      operationId: update_business_api_v1_me_businesses__business_profile_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: business_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Business Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessEntityPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/businesses/{business_profile_id}/logo:
    post:
      tags:
      - me
      summary: Upload a Business / Work logo — JPEG, PNG or WebP · Business / Work
      operationId: upload_business_logo_api_v1_me_businesses__business_profile_id__logo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: business_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Business Profile Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_business_logo_api_v1_me_businesses__business_profile_id__logo_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/availability:
    put:
      tags:
      - me
      summary: Go online / offline · Worker
      operationId: set_availability_api_v1_me_availability_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/location:
    put:
      tags:
      - me
      summary: Update live location · Worker
      operationId: update_location_api_v1_me_location_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/workers/{worker_profile_id}:
    get:
      tags:
      - me
      summary: View a worker's public profile · Business / Work
      operationId: get_worker_api_v1_me_workers__worker_profile_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: worker_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Worker Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPublicProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/deletion-requests:
    post:
      tags:
      - me
      summary: Request account deletion · Any signed-in user
      operationId: create_deletion_request_api_v1_me_deletion_requests_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequestResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/deletion-requests/current:
    get:
      tags:
      - me
      summary: Get account deletion status · Any signed-in user
      operationId: get_deletion_request_api_v1_me_deletion_requests_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequestResponse'
      security:
      - HTTPBearer: []
  /api/v1/me/roles:
    post:
      tags:
      - me
      summary: Add my other role (Business / Work or Worker); returns new tokens ·
        Any signed-in user
      operationId: add_role_api_v1_me_roles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAddRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/active-role:
    put:
      tags:
      - me
      summary: Switch between my Business / Work and Worker roles · Any signed-in
        user
      operationId: switch_active_role_api_v1_me_active_role_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRoleRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/devices:
    post:
      tags:
      - me
      summary: Register push device · Any signed-in user
      operationId: register_device_api_v1_me_devices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/me/devices/{device_id}:
    delete:
      tags:
      - me
      summary: Unregister push device · Any signed-in user
      operationId: unregister_device_api_v1_me_devices__device_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Device Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/terms:
    get:
      tags:
      - me
      summary: Terms & Conditions acceptance status · Any signed-in user
      operationId: get_terms_status_api_v1_me_terms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TermsStatus'
                type: array
                title: Response Get Terms Status Api V1 Me Terms Get
      security:
      - HTTPBearer: []
  /api/v1/me/terms/accept:
    post:
      tags:
      - me
      summary: Accept the current Terms & Conditions · Any signed-in user
      operationId: accept_terms_api_v1_me_terms_accept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/work-categories:
    get:
      tags:
      - work categories
      summary: List work categorys · Public
      description: 'Public: active items only, for sign-up and pickers. include_inactive=true
        requires an admin token.'
      operationId: list_items_api_v1_work_categories_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
                title: Response List Items Api V1 Work Categories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - work categories
      summary: Create work category · Admin
      operationId: create_item_api_v1_work_categories_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/work-categories/{item_id}:
    get:
      tags:
      - work categories
      summary: Get work category · Public
      description: Public for active items; inactive items are visible to admins only.
      operationId: get_item_api_v1_work_categories__item_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - work categories
      summary: Update work category · Admin
      operationId: update_item_api_v1_work_categories__item_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - work categories
      summary: Delete work category · Admin
      description: 'Soft delete: sets is_active=false so it disappears from sign-up
        and pickers. Existing links are kept. PATCH is_active=true to restore.'
      operationId: delete_item_api_v1_work_categories__item_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/business-types:
    get:
      tags:
      - business / work types
      summary: List Business / Work types · Public
      description: 'Public: active items only, for sign-up and pickers. include_inactive=true
        requires an admin token.'
      operationId: list_items_api_v1_business_types_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
                title: Response List Items Api V1 Business Types Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - business / work types
      summary: Create Business / Work type · Admin
      operationId: create_item_api_v1_business_types_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupCreate'
      responses:
        '201':
