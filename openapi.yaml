              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications:
    get:
      tags:
      - notifications
      summary: List notifications · Any signed-in user
      operationId: list_notifications_api_v1_notifications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread Only
      - name: limit
        in: query
        required: false
