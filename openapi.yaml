openapi: 3.1.0
info:
  title: KaaamNow API
  version: 1.0.0
paths:
  /:
    get:
      tags:
      - health
      summary: Service info · Public
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
  /health:
    get:
      tags:
      - health
      summary: Health check · Public
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/otp/send:
    post:
      tags:
      - auth
      summary: Send backend OTP (dev/testing only) · Public
      operationId: send_otp_api_v1_auth_otp_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Verify OTP and sign in · Public
      operationId: verify_otp_api_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/firebase/verify:
    post:
      tags:
      - auth
      summary: Verify Firebase phone token and sign in · Public
      operationId: verify_firebase_api_v1_auth_firebase_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/phone/check:
    post:
      tags:
      - auth
      summary: Is this phone already registered? · Public
      operationId: check_phone_api_v1_auth_phone_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/signup:
    post:
      tags:
      - auth
      summary: Register in one call (Firebase phone proof + role + profile) · Public
      operationId: signup_api_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password/login:
    post:
      tags:
      - auth
      summary: Sign in with phone and password · Public
      operationId: password_login_api_v1_auth_password_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/admin/login:
    post:
      tags:
      - auth
      summary: Admin panel sign in with email and password · Public
      operationId: admin_login_api_v1_auth_admin_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/password/reset/confirm:
    post:
