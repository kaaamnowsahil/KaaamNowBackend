openapi: 3.1.0
info:
  title: KaaamNow API
  version: 1.0.0
paths:
  /:
    get:
      tags:
      - health
      summary: Service info · Public
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
  /health:
    get:
      tags:
      - health
      summary: Health check · Public
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/otp/send:
    post:
      tags:
      - auth
      summary: Send backend OTP (dev/testing only) · Public
      operationId: send_otp_api_v1_auth_otp_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Verify OTP and sign in · Public
      operationId: verify_otp_api_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/firebase/verify:
    post:
      tags:
      - auth
      summary: Verify Firebase phone token and sign in · Public
