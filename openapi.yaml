        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - me
      summary: Update one of my Business / Work profiles · Business / Work
      operationId: update_business_api_v1_me_businesses__business_profile_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: business_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Business Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessEntityPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/businesses/{business_profile_id}/logo:
